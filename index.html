<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Моя Волна</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050505;--s1:#151517;--s2:#222226;--mu:#8e8e93;
--top:calc(var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));
--bot:var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:#fff;overflow:hidden;touch-action:manipulation;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
svg.sp{position:absolute;width:0;height:0}
.glow{position:fixed;inset:-20% -20% 30%;z-index:0;pointer-events:none;filter:blur(30px);
background:radial-gradient(55% 45% at 30% 30%,rgba(255,255,255,.11),transparent 70%),radial-gradient(45% 40% at 75% 60%,rgba(255,255,255,.07),transparent 70%);
animation:fl 16s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(6%,8%) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.glow{animation:none}}

.screen{position:absolute;inset:0;z-index:1;overflow-y:auto;display:none;
padding:calc(var(--top) + 16px) 20px calc(176px + var(--bot))}
.screen.on{display:block}
h1{font-size:34px;font-weight:800;letter-spacing:-.8px;margin-bottom:18px}
h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:28px 0 6px}
.mu{color:var(--mu);font-size:15px;padding:10px 0}

.cv{position:relative;overflow:hidden;background:linear-gradient(135deg,#38383e,#16161a);flex:none}
.cv img{display:block;width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left}
.meta b,.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{font-size:16px;font-weight:650}.meta span{font-size:13px;color:var(--mu)}
.ib{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:22px;flex:none}
.round{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--s2);font-size:24px;flex:none}
.round.w{background:#fff;color:#000}

.row{display:flex;align-items:center;gap:14px;padding:8px 0;cursor:pointer}
.row .cv{width:56px;height:56px;border-radius:12px}
.sbox{display:flex;align-items:center;gap:12px;height:54px;padding:0 18px;border-radius:20px;background:var(--s1);color:var(--mu);font-size:20px}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:17px}
.hrow{display:flex;align-items:center;gap:14px;padding:6px 0 6px 4px;font-weight:600;cursor:pointer}
.hrow>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow>svg{font-size:20px}.hrow .ib{width:40px;height:40px;font-size:18px;color:var(--mu)}
.lhead{display:flex;align-items:center;gap:14px}
.lhead .cv{width:68px;height:68px;border-radius:16px;display:grid;place-items:center;font-size:30px}

#s-flow.on{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.chip{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 20px;border-radius:21px;border:1px solid rgba(255,255,255,.22);font-weight:650;font-size:15px}
.chip svg{display:none;font-size:14px}.chip.x svg{display:block}
.hero{font-size:clamp(42px,14vw,60px);line-height:1;margin:26px 0 30px;letter-spacing:-1.5px}
#s-flow .cv{width:170px;height:170px;border-radius:26px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.frow{display:flex;align-items:center;gap:10px;width:100%;margin-top:26px}
.pill{flex:1;min-width:0;height:60px;padding:0 20px;border-radius:30px;background:rgba(255,255,255,.09);font-weight:700;font-size:17px}
.pill span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#s-flow .mu{margin-top:14px;font-size:14px}

#mini{position:fixed;left:10px;right:10px;bottom:calc(68px + var(--bot));z-index:20;display:flex;align-items:center;gap:2px;padding:8px;
border-radius:20px;background:rgba(42,42,46,.8);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid rgba(255,255,255,.12);overflow:hidden}
.mi-l{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
#mini .cv{width:46px;height:46px;border-radius:10px}
#mini .ib{width:40px;height:40px;font-size:21px}
.mi-bar{position:absolute;left:0;right:0;bottom:0;height:2px}.mi-bar i{display:block;height:100%;width:0;background:#fff}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:8px 0 calc(8px + var(--bot));
background:rgba(12,12,14,.85);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:.5px solid rgba(255,255,255,.1)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mu)}
.tab svg{font-size:26px}.tab.on{color:#fff}

#fp{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden;visibility:hidden;transform:translateY(100%);
transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
#fp.open{visibility:visible;transform:none;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
.fp-bg{position:absolute;inset:-60px;background:var(--img) center/cover;filter:blur(60px) brightness(.5) saturate(1.3)}
.fp-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(var(--top) + 12px) 26px calc(24px + var(--bot))}
.fp-top{width:100%;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
.fp-top .ib{width:42px;height:42px;background:rgba(255,255,255,.15)}.fp-top i{width:42px}
.fp-cover{flex:1;width:100%;display:flex;align-items:center;justify-content:center}
.fp-cover .cv{width:min(82vw,44vh,360px);aspect-ratio:1;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.fp-info{width:100%;display:flex;align-items:center;gap:12px}
.fp-info .meta b{font-size:24px;font-weight:800;letter-spacing:-.4px}.fp-info .meta span{font-size:16px;color:rgba(255,255,255,.7)}
.fp-info .ib{background:rgba(255,255,255,.14)}
.times{width:100%;display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.65)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:10px}
.ctrl .ib{width:64px;height:64px;font-size:32px}.ctrl .round{width:78px;height:78px;font-size:34px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin-top:10px;background:none;outline:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,#fff var(--p,0%),rgba(255,255,255,.25) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-6px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.25)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:#fff}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:0;border-radius:50%;background:#fff}
.hide{display:none!important}
#toast{position:fixed;left:50%;top:calc(var(--top) + 8px);z-index:99;max-width:90vw;padding:10px 16px;border-radius:14px;text-align:center;
font-size:14px;background:rgba(50,50,56,.96);opacity:0;transform:translate(-50%,-16px);transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg class="sp" aria-hidden="true">
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7zM17 5h2.5v14H17z"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5l-9 7 9 7zM7 5H4.5v14H7z"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5c0 6.1-8 11-8 11z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 8c3-3 6 3 9 0s6 3 9 0M3 13c3-3 6 3 9 0s6 3 9 0M3 18c3-3 6 3 9 0s6 3 9 0"/></symbol>
<symbol id="i-lib" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 5l4 15"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>
<div class="glow"></div>

<section id="s-flow" class="screen on">
  <button class="chip" id="flowSrc"><svg><use href="#i-x"/></svg><span>Бесконечный поток</span></button>
  <h1 class="hero">Мой поток</h1>
  <div class="cv"><img class="cvimg" alt="" onerror="this.style.visibility='hidden'"></div>
  <div class="frow">
    <button class="pp round w" id="flowPlay" aria-label="Играть"><svg class="f"><use href="#i-play"/></svg></button>
    <button class="pill" id="flowPill"><span id="flowT">Включить поток</span></button>
    <button class="heart round" aria-label="Нравится"><svg><use href="#i-heart"/></svg></button>
  </div>
  <p class="mu">Музыка независимых исполнителей Jamendo</p>
</section>

<section id="s-search" class="screen">
  <h1>Поиск</h1>
  <label class="sbox"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="Трек или исполнитель" autocomplete="off"></label>
  <div id="hs">
    <h2>Недавно искал</h2><div id="hist"></div>
    <h2>Недавно слушал</h2><div id="rec"></div>
  </div>
  <div id="res" hidden style="margin-top:14px"></div>
</section>

<section id="s-lib" class="screen">
  <h1>Коллекция</h1>
  <div class="lhead">
    <div class="cv"><svg class="f"><use href="#i-heart"/></svg></div>
    <div class="meta"><b style="font-size:22px;font-weight:800">Мне нравится</b><span id="likeCnt">0 треков</span></div>
    <button class="round" id="likePlay" aria-label="Играть"><svg class="f"><use href="#i-play"/></svg></button>
  </div>
  <div id="likes" style="margin-top:12px"></div>
</section>

<div id="mini" class="hide">
  <div class="mi-l" id="miOpen">
    <div class="cv"><img class="cvimg" alt="" onerror="this.style.visibility='hidden'"></div>
    <div class="meta"><b id="miT"></b><span id="miA"></span></div>
  </div>
  <button class="ib" id="miPrev" aria-label="Предыдущий"><svg class="f"><use href="#i-prev"/></svg></button>
  <button class="ib pp" id="miPp" aria-label="Пауза"><svg class="f"><use href="#i-play"/></svg></button>
  <button class="ib" id="miNext" aria-label="Следующий"><svg class="f"><use href="#i-next"/></svg></button>
  <div class="mi-bar"><i id="miBar"></i></div>
</div>

<nav id="tabs">
  <button class="tab on" data-t="flow"><svg><use href="#i-wave"/></svg>Мой поток</button>
  <button class="tab" data-t="search"><svg><use href="#i-search"/></svg>Поиск</button>
  <button class="tab" data-t="lib"><svg><use href="#i-lib"/></svg>Коллекция</button>
</nav>

<div id="fp">
  <div class="fp-bg"></div>
  <div class="fp-in">
    <div class="fp-top"><button class="ib" id="fpClose" aria-label="Свернуть"><svg><use href="#i-down"/></svg></button><span id="fpSrc"></span><i></i></div>
    <div class="fp-cover"><div class="cv"><img class="cvimg" alt="" onerror="this.style.visibility='hidden'"></div></div>
    <div class="fp-info">
      <div class="meta"><b id="fpT"></b><span id="fpA"></span></div>
      <button class="heart ib" aria-label="Нравится"><svg><use href="#i-heart"/></svg></button>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
    <div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
    <div class="ctrl">
      <button class="ib" id="fpPrev" aria-label="Предыдущий"><svg class="f"><use href="#i-prev"/></svg></button>
      <button class="round w pp" id="fpPp" aria-label="Пауза"><svg class="f"><use href="#i-play"/></svg></button>
      <button class="ib" id="fpNext" aria-label="Следующий"><svg class="f"><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<div id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),A=$('#audio');
const tg=window.Telegram&&Telegram.WebApp;
try{tg.ready();tg.expand();tg.disableVerticalSwipes();tg.setBackgroundColor('#050505')}catch{}
const hp=()=>{try{tg.HapticFeedback.impactOccurred('light')}catch{}};
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
// тишина: «разблокирует» звук на iPhone при первом нажатии
const SIL='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAA';

let queue=[],idx=-1,wave=false,src='Бесконечный поток',errs=0,busy=0,drag=0,un=0,tt,st,rq=0;
let likes=LS.get('likes',[]),hist=LS.get('hist',[]),recent=LS.get('recent',[]);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2500)}
const unlock=()=>{if(un)return;un=1;A.src=SIL;A.play().catch(()=>{})};
['click','touchend'].forEach(e=>document.addEventListener(e,unlock,{capture:true}));

/* ---------- Каталог Jamendo ---------- */
async function api(q){
  const r=await fetch('https://api.jamendo.com/v3.0/tracks/?client_id=59929853&format=json&imagesize=300&audioformat=mp32&'+q);
  const j=await r.json();
  return(j.results||[]).filter(t=>t.audio).map(t=>({id:t.id,name:t.name,artist:t.artist_name,image:t.image,audio:t.audio}));
}
async function more(){
  if(busy)return;busy=1;
  try{
    const tags=['rock','pop','electronic','hiphop','chillout','jazz','indie','ambient'];
    const d=await api('tags='+tags[Math.random()*tags.length|0]+'&order=popularity_month&limit=15&offset='+(Math.random()*40|0));
    const ids=new Set(queue.map(t=>t.id));queue.push(...d.filter(t=>!ids.has(t.id)));
  }finally{busy=0}
}

/* ---------- Воспроизведение ---------- */
function playList(list,i,label){queue=list.slice();idx=i;wave=false;src=label;load()}
async function startWave(){
  const q0=queue,i0=idx,w0=wave,s0=src;
  wave=true;src='Бесконечный поток';queue=[];idx=-1;toast('Загружаю поток…');
  try{await more();if(!queue.length)throw 0;idx=0;load()}
  catch{queue=q0;idx=i0;wave=w0;src=s0;toast('Не удалось загрузить поток. Проверь интернет')}
}
function load(){
  const t=queue[idx];if(!t)return;
  if(wave&&idx>=queue.length-3)more().catch(()=>{});
  ui();recent=[t,...recent.filter(x=>x.id!==t.id)].slice(0,10);LS.set('recent',recent);
  A.src=t.audio;
  A.play().catch(e=>{if(e.name==='NotAllowedError')toast('Нажми ▶, чтобы начать')});
}
async function next(){
  if(!queue.length)return;
  if(idx>=queue.length-1&&wave)await more();
  idx=idx<queue.length-1?idx+1:0;load();
}
function prev(){
  if(!queue.length)return;
  if(A.currentTime>3||idx<=0){A.currentTime=0;return}
  idx--;load();
}
function toggle(){if(idx<0)return startWave();A.paused?A.play().catch(()=>{}):A.pause();hp()}
const setPlay=p=>$$('.pp use').forEach(u=>u.setAttribute('href',p?'#i-pause':'#i-play'));

A.onplay=()=>idx>=0&&setPlay(true);
A.onpause=()=>idx>=0&&setPlay(false);
A.onplaying=()=>{errs=0};
A.onended=()=>{if(idx<0)return;if(wave||idx<queue.length-1)next();else setPlay(false)};
A.onerror=()=>{if(idx<0)return;if(++errs>4)return toast('Трек недоступен. Проверь интернет');toast('Трек недоступен, включаю следующий');next()};
A.onloadedmetadata=()=>{$('#td').textContent=fmt(A.duration)};
A.ontimeupdate=()=>{
  if(!isFinite(A.duration)||!A.duration)return;
  const v=A.currentTime/A.duration*1000;
  $('#miBar').style.width=v/10+'%';
  if(drag)return;
  $('#seek').value=v;$('#seek').style.setProperty('--p',v/10+'%');$('#tc').textContent=fmt(A.currentTime);
};
const seek=$('#seek');
seek.addEventListener('input',()=>{drag=1;seek.style.setProperty('--p',seek.value/10+'%');$('#tc').textContent=fmt(seek.value/1000*A.duration)});
seek.addEventListener('change',()=>{if(isFinite(A.duration))A.currentTime=seek.value/1000*A.duration;drag=0});

try{const m=navigator.mediaSession;m.setActionHandler('play',()=>A.play());m.setActionHandler('pause',()=>A.pause());m.setActionHandler('previoustrack',prev);m.setActionHandler('nexttrack',next)}catch{}

/* ---------- Интерфейс ---------- */
function ui(){
  const t=queue[idx];if(!t)return;
  $('#mini').classList.remove('hide');
  $('#miT').textContent=$('#fpT').textContent=$('#flowT').textContent=t.name;
  $('#miA').textContent=$('#fpA').textContent=t.artist;
  $$('.cvimg').forEach(i=>{i.style.visibility='visible';i.src=t.image||''});
  $('#fp').style.setProperty('--img','url("'+(t.image||'').replace(/"/g,'%22')+'")');
  $('#flowSrc span').textContent=$('#fpSrc').textContent=src;
  $('#flowSrc').classList.toggle('x',!wave);
  syncLike();
  try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist,artwork:[{src:t.image,sizes:'300x300'}]})}catch{}
}
function tab(n){
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+n));
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
  if(n==='lib')renderLib();if(n==='search')renderSearch();hp();
}
function openFp(){if(idx<0)return;$('#fp').classList.add('open');try{tg.BackButton.show()}catch{}}
function closeFp(){$('#fp').classList.remove('open');try{tg.BackButton.hide()}catch{}}
try{tg.BackButton.onClick(closeFp)}catch{}
document.addEventListener('keydown',e=>e.key==='Escape'&&closeFp());
let ty=0;const fp=$('#fp');
fp.addEventListener('touchstart',e=>{ty=e.target.closest('input')?-1:e.touches[0].clientY},{passive:true});
fp.addEventListener('touchend',e=>{if(ty>=0&&e.changedTouches[0].clientY-ty>110)closeFp()},{passive:true});

/* ---------- Нравится / история ---------- */
const isLiked=t=>!!t&&likes.some(l=>l.id===t.id);
function syncLike(){const l=isLiked(queue[idx]);$$('.heart svg').forEach(s=>s.classList.toggle('f',l))}
function toggleLike(){
  const t=queue[idx];if(!t)return toast('Сначала включи трек');
  likes=isLiked(t)?likes.filter(l=>l.id!==t.id):[t,...likes];
  LS.set('likes',likes);syncLike();renderLib();hp();
}
const plural=n=>{const m=n%10,h=n%100;return n+(m===1&&h!==11?' трек':m>=2&&m<=4&&(h<10||h>=20)?' трека':' треков')};

function rows(el,list,label,empty){
  el.innerHTML=list.length?list.map((t,i)=>'<div class="row" data-i="'+i+'"><div class="cv"><img src="'+esc(t.image)+'" loading="lazy" alt="" onerror="this.style.visibility=\'hidden\'"></div><div class="meta"><b>'+esc(t.name)+'</b><span>'+esc(t.artist)+'</span></div></div>').join(''):'<p class="mu">'+empty+'</p>';
  el.onclick=e=>{const r=e.target.closest('.row');if(r)playList(list,+r.dataset.i,label)};
}
function renderLib(){$('#likeCnt').textContent=plural(likes.length);rows($('#likes'),likes,'Мне нравится','Нажми ♥ на треке, и он появится здесь')}
function renderSearch(){
  const q=$('#q').value.trim();$('#hs').hidden=!!q;$('#res').hidden=!q;if(q)return;
  $('#hist').innerHTML=hist.map((h,i)=>'<div class="hrow" data-i="'+i+'"><svg><use href="#i-search"/></svg><span>'+esc(h)+'</span><button class="ib" data-x="'+i+'" aria-label="Удалить"><svg><use href="#i-x"/></svg></button></div>').join('')||'<p class="mu">Пока пусто</p>';
  rows($('#rec'),recent,'Недавно слушал','Здесь появятся прослушанные треки');
}
async function search(v){
  const n=++rq;$('#hs').hidden=true;$('#res').hidden=false;$('#res').innerHTML='<p class="mu">Ищу…</p>';
  try{
    const r=await api('limit=25&search='+encodeURIComponent(v));if(n!==rq)return;
    hist=[v,...hist.filter(x=>x!==v)].slice(0,6);LS.set('hist',hist);
    rows($('#res'),r,'Из поиска','Ничего не найдено. Попробуй другой запрос');
  }catch{if(n===rq)$('#res').innerHTML='<p class="mu">Ошибка загрузки. Проверь интернет</p>'}
}
$('#q').oninput=e=>{clearTimeout(st);rq++;const v=e.target.value.trim();if(!v)return renderSearch();st=setTimeout(()=>search(v),350)};
$('#q').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
$('#hist').onclick=e=>{
  const x=e.target.closest('[data-x]');
  if(x){hist.splice(+x.dataset.x,1);LS.set('hist',hist);return renderSearch()}
  const r=e.target.closest('.hrow');if(r){$('#q').value=hist[+r.dataset.i];search($('#q').value)}
};

/* ---------- Кнопки ---------- */
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)tab(b.dataset.t)};
$('#flowPlay').onclick=toggle;
$('#flowPill').onclick=()=>idx<0?startWave():openFp();
$('#flowSrc').onclick=()=>{if(!wave)startWave()};
$('#likePlay').onclick=()=>likes.length?playList(likes,0,'Мне нравится'):toast('Пока нет понравившихся треков');
$('#miOpen').onclick=openFp;
$('#miPp').onclick=$('#fpPp').onclick=toggle;
$('#miPrev').onclick=$('#fpPrev').onclick=prev;
$('#miNext').onclick=$('#fpNext').onclick=()=>{next();hp()};
$('#fpClose').onclick=closeFp;
$$('.heart').forEach(b=>b.onclick=toggleLike);

renderSearch();renderLib();
</script>
</body>
</html>
