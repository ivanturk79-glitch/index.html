<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { padding: 20px 20px 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }

        .content { flex: 1; overflow-y: auto; padding: 0 20px 100px; display: none; }
        .content.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .content.search-active { display: block; }

        .wave-btn { width: 200px; height: 200px; border-radius: 50%; background: linear-gradient(135deg, #FFD60A, #FF9F0A); border: none; font-size: 22px; font-weight: bold; color: #000; cursor: pointer; box-shadow: 0 10px 30px rgba(255, 214, 10, 0.3); transition: transform 0.1s; }
        .wave-btn:active { transform: scale(0.95); }
        .wave-sub { color: #8E8E93; margin-top: 24px; font-size: 15px; text-align: center; }

        .search-input { width: 100%; background: #1C1C1E; border: none; border-radius: 10px; padding: 12px 16px; color: #fff; font-size: 17px; margin-bottom: 15px; outline: none; }
        .search-item { display: flex; align-items: center; background: #1C1C1E; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .search-cover { width: 44px; height: 44px; border-radius: 6px; background: #333; margin-right: 12px; object-fit: cover; flex-shrink: 0; }
        .track-meta { flex: 1; overflow: hidden; margin-right: 10px; }
        .track-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 13px; color: #8E8E93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .add-btn { background: #2C2C2E; color: #FFD60A; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; flex-shrink: 0; }

        /* Мини-плеер */
        .mini-player { position: fixed; bottom: 83px; left: 12px; right: 12px; background: rgba(30, 30, 32, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; border: 0.5px solid rgba(255,255,255,0.1); z-index: 10; cursor: pointer; }
        .player-cover { width: 42px; height: 42px; background: #3A3A3C; border-radius: 8px; margin-right: 12px; object-fit: cover; }
        .player-meta { flex: 1; pointer-events: none; overflow: hidden; }
        .player-track { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-art { font-size: 12px; color: #8E8E93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play-ctrl { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 5px 10px; z-index: 11; }

        /* Полноэкранный плеер iOS */
        .full-player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #121214; z-index: 100; display: flex; flex-direction: column; padding: 30px 24px 40px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.17, 0.67, 0.1, 1.01); }
        .full-player.open { transform: translateY(0); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .drag-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; }

        .full-cover { width: 100%; aspect-ratio: 1/1; border-radius: 16px; background: #222; margin-bottom: 25px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .full-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .full-artist { font-size: 16px; color: #8E8E93; margin-bottom: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-container { width: 100%; margin-bottom: 6px; }
        .progress-bar { width: 100%; height: 6px; background: #3A3A3C; border-radius: 3px; appearance: none; outline: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
        
        .time-box { display: flex; justify-content: space-between; font-size: 12px; color: #8E8E93; margin-bottom: 30px; }
        .controls { display: flex; justify-content: space-around; align-items: center; }
        .ctrl-btn { background: none; border: none; color: #fff; font-size: 32px; cursor: pointer; }
        .ctrl-btn.play { font-size: 54px; color: #FFD60A; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 83px; background: rgba(20, 20, 22, 0.9); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-top: 0.5px solid rgba(255,255,255,0.15); display: flex; justify-content: space-around; padding-top: 8px; }
        .tab-item { background: none; border: none; color: #8E8E93; font-size: 11px; display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; }
        .tab-item.active { color: #FFD60A; }
        .tab-icon { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header" id="pageTitle">Музыка</div>

    <!-- Главная -->
    <div id="tab-home" class="content active">
        <button class="wave-btn" onclick="playRandomWave()">Моя Волна</button>
        <div class="wave-sub">Бесконечный поток музыки</div>
    </div>

    <!-- Поиск -->
    <div id="tab-search" class="content search-active" style="display: none;">
        <input type="text" class="search-input" placeholder="Поиск музыки..." id="searchInput" oninput="searchMusic(this.value)">
        <div id="resultsList" style="color: #8E8E93; font-size: 14px; text-align: center; margin-top: 20px;">Введите запрос для поиска</div>
    </div>

    <!-- Плейлист -->
    <div id="tab-offline" class="content" style="display: none;">
        <div id="playlistList" style="width: 100%;">
            <div style="color: #8E8E93; font-size: 15px; text-align: center; margin-top: 40px;">Плейлист пуст. Добавляй треки из поиска.</div>
        </div>
    </div>

    <!-- Мини-плеер -->
    <div class="mini-player" onclick="openFullPlayer(event)">
        <img class="player-cover" id="playerCover" src="" style="display:none;">
        <div class="player-meta">
            <div class="player-track" id="currentTrackTitle">Ничего не играет</div>
            <div class="player-art" id="currentTrackArtist">Выбери трек</div>
        </div>
        <button class="play-ctrl" id="playBtn" onclick="togglePlay(event)">▶</button>
    </div>

    <!-- Полноэкранный плеер -->
    <div class="full-player" id="fullPlayer">
        <div class="top-bar">
            <div class="drag-handle"></div>
            <button class="close-btn" onclick="closeFullPlayer()">✕</button>
        </div>
        <img src="" id="fullPlayerCover" class="full-cover">
        <div class="full-title" id="fullPlayerTitle">Название трека</div>
        <div class="full-artist" id="fullPlayerArtist">Исполнитель</div>
        
        <div class="progress-container">
            <input type="range" class="progress-bar" id="seekBar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this)">
        </div>
        <div class="time-box">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="playPrev()">⏮</button>
            <button class="ctrl-btn play" id="fullPlayBtn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="playNext()">⏭</button>
        </div>
    </div>

    <audio id="audioElement"></audio>

    <!-- Навигация -->
    <div class="tab-bar">
        <button class="tab-item active" onclick="switchTab('home', this)"><span class="tab-icon">🏠</span>Главная</button>
        <button class="tab-item" onclick="switchTab('search', this)"><span class="tab-icon">🔍</span>Поиск</button>
        <button class="tab-item" onclick="switchTab('offline', this)"><span class="tab-icon">📥</span>Плейлист</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const audio = document.getElementById('audioElement');
        let playlist = [];
        let currentIndex = -1;
        let searchTimeout = null;

        audio.ontimeupdate = () => {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('seekBar').value = progress;
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration);
        };

        audio.onended = () => { playNext(); };

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function seekAudio(slider) {
            if (audio.duration) {
                audio.currentTime = (slider.value / 100) * audio.duration;
            }
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).style.display = tabId === 'search' ? 'block' : 'flex';
            el.classList.add('active');
            document.getElementById('pageTitle').innerText = { home: 'Музыка', search: 'Поиск', offline: 'Плейлист' }[tabId];
            tg.HapticFeedback.selectionChanged();
        }

        async function searchMusic(query) {
            clearTimeout(searchTimeout);
            if (!query.trim()) {
                document.getElementById('resultsList').innerHTML = '<div style="color: #8E8E93; text-align: center; margin-top: 20px;">Введите запрос для поиска</div>';
                return;
            }
            searchTimeout = setTimeout(async () => {
                try {
                    // Используем надежный открытый поисковый шлюз
                    let res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query + ' audio')}&filter=videos`);
                    let data = await res.json();
                    let list = document.getElementById('resultsList');
                    
                    if (!data.items || data.items.length === 0) {
                        list.innerHTML = '<div style="color: #8E8E93; text-align: center; margin-top: 20px;">Ничего не найдено</div>';
                        return;
                    }

                    // Фильтруем только видео и достаем аудиопотоки
                    let tracks = data.items.filter(item => item.type === 'stream').slice(0, 15);
                    
                    if (tracks.length === 0) {
                        list.innerHTML = '<div style="color: #8E8E93; text-align: center; margin-top: 20px;">Ничего не найдено</div>';
                        return;
                    }

                    window.lastSearchResult = tracks;

                    list.innerHTML = tracks.map((track, i) => `
                        <div class="search-item" onclick="playTrackFromSearch(${i})">
                            <img src="${track.thumbnail}" class="search-cover">
                            <div class="track-meta">
                                <div class="track-title">${track.title}</div>
                                <div class="track-artist">${track.uploaderName || 'Неизвестно'}</div>
                            </div>
                            <button class="add-btn" onclick="event.stopPropagation(); addToPlaylist(${i})">+</button>
                        </div>
                    `).join('');
                } catch (e) {
                    console.error(e);
                    document.getElementById('resultsList').innerHTML = '<div style="color: #8E8E93; text-align: center; margin-top: 20px;">Ошибка поиска. Попробуйте еще раз</div>';
                }
            }, 500);
        }

        async function playTrackFromSearch(index) {
            let results = window.lastSearchResult;
            if (!results || !results[index]) return;
            let item = results[index];
            
            try {
                // Получаем прямую ссылку на аудиопоток
                let res = await fetch(`https://pipedapi.kavin.rocks/streams/${item.url.split('/watch?v=')[1]}`);
                let data = await res.json();
                let audioStream = data.audioStreams.find(s => s.format === 'M4A' || s.format === 'WEBAUDIO') || data.audioStreams[0];
                
                if (!audioStream) {
                    alert('Не удалось получить аудиопоток');
                    return;
                }

                playlist = results.map((t, idx) => ({ 
                    id: t.url, 
                    title: t.title, 
                    artist: t.uploaderName, 
                    cover: t.thumbnail,
                    isResolved: idx === index,
                    url: idx === index ? audioStream.url : ''
                }));
                currentIndex = index;
                
                playTrack(audioStream.url, item.title, item.uploaderName, item.thumbnail);
            } catch(e) {
                console.error(e);
            }
        }

        function playTrack(url, title, artist, cover) {
            audio.src = url;
            audio.play();
            document.getElementById('currentTrackTitle').innerText = title;
            document.getElementById('currentTrackArtist').innerText = artist;
            document.getElementById('fullPlayerTitle').innerText = title;
            document.getElementById('fullPlayerArtist').innerText = artist;
            
            let coverEl = document.getElementById('playerCover');
            let fullCoverEl = document.getElementById('fullPlayerCover');
            coverEl.src = cover; fullCoverEl.src = cover;
            coverEl.style.display = 'block';

            document.getElementById('playBtn').innerText = '⏸';
            document.getElementById('fullPlayBtn').innerText = '⏸';
            tg.HapticFeedback.impactOccurred('light');
        }

        function togglePlay(event) {
            if (event) event.stopPropagation();
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                document.getElementById('playBtn').innerText = '⏸';
                document.getElementById('fullPlayBtn').innerText = '⏸';
            } else {
                audio.pause();
                document.getElementById('playBtn').innerText = '▶';
                document.getElementById('fullPlayBtn').innerText = '▶';
            }
            tg.HapticFeedback.impactOccurred('light');
        }

        function openFullPlayer(event) {
            if (audio.src) {
                document.getElementById('fullPlayer').classList.add('open');
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function closeFullPlayer() {
            document.getElementById('fullPlayer').classList.remove('open');
            tg.HapticFeedback.impactOccurred('light');
        }

        function addToPlaylist(index) {
            let t = window.lastSearchResult[index];
            if (!t) return;
            playlist.push({ id: t.url, title: t.title, artist: t.uploaderName, cover: t.thumbnail, url: '' });
            renderPlaylist();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function renderPlaylist() {
            let container = document.getElementById('playlistList');
            if (!playlist.length) return;
            container.innerHTML = playlist.map((t, i) => `
                <div class="search-item" onclick="playPlaylistTrack(${i})">
                    <img src="${t.cover}" class="search-cover">
                    <div class="track-meta">
                        <div class="track-title">${t.title}</div>
                        <div class="track-artist">${t.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        async function playPlaylistTrack(index) {
            currentIndex = index;
            let t = playlist[currentIndex];
            if (t.url) {
                playTrack(t.url, t.title, t.artist, t.cover);
            } else {
                // Подтягиваем ссылку на поток, если её еще нет
                try {
                    let res = await fetch(`https://pipedapi.kavin.rocks/streams/${t.id.split('/watch?v=')[1]}`);
                    let data = await res.json();
                    let audioStream = data.audioStreams.find(s => s.format === 'M4A' || s.format === 'WEBAUDIO') || data.audioStreams[0];
                    if (audioStream) {
                        t.url = audioStream.url;
                        playTrack(t.url, t.title, t.artist, t.cover);
                    }
                } catch(e) { console.error(e); }
            }
        }

        function playNext() {
            if (playlist.length > 0) {
                currentIndex = (currentIndex + 1) % playlist.length;
                playPlaylistTrack(currentIndex);
            }
        }

        function playPrev() {
            if (playlist.length > 0) {
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                playPlaylistTrack(currentIndex);
            }
        }

        async function playRandomWave() {
            try {
                // Загружаем случайные популярные треки для «Моей волны»
                let queries = ['top hits 2026', 'phonk playlist', 'chill lofi hip hop', 'popular music mix'];
                let randomQuery = queries[Math.floor(Math.random() * queries.length)];
                
                let res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(randomQuery)}&filter=videos`);
                let data = await res.json();
                
                if (data.items && data.items.length > 0) {
                    let tracks = data.items.filter(item => item.type === 'stream');
                    playlist = tracks.map(t => ({ id: t.url, title: t.title, artist: t.uploaderName, cover: t.thumbnail, url: '' }));
                    currentIndex = Math.floor(Math.random() * playlist.length);
                    playPlaylistTrack(currentIndex);
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
