<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { padding: 20px 20px 10px; font-size: 28px; font-weight: 700; }
        .content { flex: 1; overflow-y: auto; padding: 0 20px 100px; display: none; }
        .content.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .content.search-active { display: block; }

        .wave-btn { width: 180px; height: 180px; border-radius: 50%; background: linear-gradient(135deg, #FFD60A, #FF9F0A); border: none; font-size: 20px; font-weight: bold; color: #000; cursor: pointer; box-shadow: 0 10px 25px rgba(255, 214, 10, 0.3); }
        .wave-sub { color: #8E8E93; margin-top: 20px; font-size: 15px; text-align: center; }

        .search-input { width: 100%; background: #1C1C1E; border: none; border-radius: 10px; padding: 12px 16px; color: #fff; font-size: 17px; margin-bottom: 15px; outline: none; }
        .search-item { display: flex; align-items: center; background: #1C1C1E; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .search-cover { width: 44px; height: 44px; border-radius: 6px; background: #333; margin-right: 12px; object-fit: cover; }
        .track-meta { flex: 1; overflow: hidden; }
        .track-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 13px; color: #8E8E93; margin-top: 2px; }

        .mini-player { position: fixed; bottom: 83px; left: 12px; right: 12px; background: rgba(30, 30, 32, 0.95); backdrop-filter: blur(20px); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; border: 0.5px solid rgba(255,255,255,0.1); z-index: 10; }
        .player-meta { flex: 1; margin-left: 12px; overflow: hidden; }
        .player-track { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-art { font-size: 12px; color: #8E8E93; }
        .play-ctrl { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 5px 10px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 83px; background: rgba(20, 20, 22, 0.9); backdrop-filter: blur(25px); border-top: 0.5px solid rgba(255,255,255,0.15); display: flex; justify-content: space-around; padding-top: 8px; z-index: 20; }
        .tab-item { background: none; border: none; color: #8E8E93; font-size: 11px; display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; }
        .tab-item.active { color: #FFD60A; }
        .tab-icon { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header" id="pageTitle">Моя Волна</div>

    <!-- Главная -->
    <div id="tab-home" class="content active">
        <button class="wave-btn" onclick="playRandomWave()">Моя Волна</button>
        <div class="wave-sub">Бесконечный поток треков</div>
    </div>

    <!-- Поиск -->
    <div id="tab-search" class="content search-active" style="display: none;">
        <input type="text" class="search-input" placeholder="Поиск музыки..." id="searchInput" oninput="searchMusic(this.value)">
        <div id="resultsList" style="color: #8E8E93; font-size: 14px; text-align: center; margin-top: 20px;">Введите запрос для поиска</div>
    </div>

    <!-- Мини-плеер -->
    <div class="mini-player">
        <div class="player-meta">
            <div class="player-track" id="currTitle">Трек не выбран</div>
            <div class="player-art" id="currArtist">Выберите трек</div>
        </div>
        <button class="play-ctrl" id="playBtn" onclick="togglePlay()">▶</button>
    </div>

    <audio id="audio" preload="auto"></audio>

    <!-- Навигация -->
    <div class="tab-bar">
        <button class="tab-item active" onclick="switchTab('home', this)"><span class="tab-icon">🏠</span>Главная</button>
        <button class="tab-item" onclick="switchTab('search', this)"><span class="tab-icon">🔍</span>Поиск</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const audio = document.getElementById('audio');
        let currentTracks = [];

        function switchTab(tabId, el) {
            document.querySelectorAll('.content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).style.display = tabId === 'search' ? 'block' : 'flex';
            el.classList.add('active');
            document.getElementById('pageTitle').innerText = tabId === 'home' ? 'Моя Волна' : 'Поиск';
            tg.HapticFeedback.selectionChanged();
        }

        async function searchMusic(query) {
            if (!query.trim()) {
                document.getElementById('resultsList').innerHTML = '<div style="color: #8E8E93; text-align: center; margin-top: 20px;">Введите запрос для поиска</div>';
                return;
            }
            try {
                // Используем стабильный публичный каталог Jamendo с запросом полных треков (audioformat=mp32)
                let res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=59929853&format=jsonjson&limit=20&search=${encodeURIComponent(query)}&audioformat=mp32`);
                let data = await res.json();
                
                let list = document.getElementById('resultsList');
                if (!data.results || data.results.length === 0) {
                    list.innerHTML = '<div style="color: #8E8E93; text-align: center; margin-top: 20px;">Ничего не найдено</div>';
                    return;
                }

                currentTracks = data.results;
                list.innerHTML = currentTracks.map((t, i) => `
                    <div class="search-item" onclick="playTrack(${i})">
                        <img src="${t.image}" class="search-cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&q=80'">
                        <div class="track-meta">
                            <div class="track-title">${t.name}</div>
                            <div class="track-artist">${t.artist_name}</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('resultsList').innerHTML = '<div style="color: #8E8E93; text-align: center; margin-top: 20px;">Ошибка загрузки</div>';
            }
        }

        async function playRandomWave() {
            try {
                let tags = ['rock', 'pop', 'electronic', 'hiphop', 'chillout'];
                let randomTag = tags[Math.floor(Math.random() * tags.length)];
                
                let res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=59929853&format=jsonjson&limit=15&tags=${randomTag}&audioformat=mp32`);
                let data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    currentTracks = data.results;
                    let randomIndex = Math.floor(Math.random() * currentTracks.length);
                    playTrack(randomIndex);
                    switchTab('search', document.querySelectorAll('.tab-item')[1]);
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch(e) {
                console.error(e);
            }
        }

        function playTrack(index) {
            let t = currentTracks[index];
            if (!t || !t.audio) return;
            
            // Используем параметр audio, который выдает полную версию трека (mp32)
            audio.src = t.audio;
            audio.play().then(() => {
                document.getElementById('currTitle').innerText = t.name;
                document.getElementById('currArtist').innerText = t.artist_name;
                document.getElementById('playBtn').innerText = '⏸';
            }).catch(err => {
                console.log("Play error:", err);
            });
            tg.HapticFeedback.impactOccurred('light');
        }

        function togglePlay() {
            if (!audio.src && currentTracks.length > 0) {
                playTrack(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                document.getElementById('playBtn').innerText = '⏸';
            } else {
                audio.pause();
                document.getElementById('playBtn').innerText = '▶';
            }
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
